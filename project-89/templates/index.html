<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Date Difference Calculator</h1>
        
        <form action="/getweather" method="POST">
            
            <div class="date-section">
                <h2>Start Date</h2>
                <div class="input-group">
                    <input type="number" name="year1" placeholder="YYYY" required min="1000" max="9999">
                    <input type="number" name="m1" placeholder="MM" required min="1" max="12">
                    <input type="number" name="dt1" placeholder="DD" required min="1" max="31">
                </div>
            </div>

            <div class="date-section">
                <h2>End Date</h2>
                <div class="input-group">
                    <input type="number" name="year2" placeholder="YYYY" required min="1000" max="9999">
                    <input type="number" name="m2" placeholder="MM" required min="1" max="12">
                    <input type="number" name="dt2" placeholder="DD" required min="1" max="31">
                </div>
            </div>

            <button type="submit" class="submit-btn">Calculate Difference</button>
        </form>

        {% if difference is defined %}
        <div class="result-box">
            <h3>Result:</h3>
            <p>The difference is <strong>{{ difference }}</strong> days.</p>
        </div>
        {% endif %}
        
    </div>
</body>
</html>>
