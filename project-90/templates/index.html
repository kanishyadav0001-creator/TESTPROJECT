<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        
        <!-- Sends data back to the same root route -->
        <form action="/" method="POST">
            <div class="input-group">
                <label for="Weight">Weight (kg):</label>
                <!-- NOTICE: name matches "Weight" in Python code exactly -->
                <input type="number" step="0.1" name="Weight" id="Weight" placeholder="e.g. 70" required>
            </div>

            <div class="input-group">
                <label for="Height">Height (cm):</label>
                <!-- NOTICE: name matches "Height" in Python code exactly -->
                <input type="number" step="0.1" name="Height" id="Height" placeholder="e.g. 175" required>
            </div>

            <button type="submit" class="submit-btn">Calculate BMI</button>
        </form>

        <!-- Only display this block if the BMI calculation has taken place -->
        {% if bmi != "" %}
        <div class="result-box">
            <h3>Your Result:</h3>
            <p>Your calculated BMI is <strong>{{ bmi }}</strong></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
