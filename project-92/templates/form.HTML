<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Details Form</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>Enter Resume Details</h2>
        <!-- The form will submit data to the backend via POST -->
        <form action="/submit" method="POST">
            <div class="form-group">
                <label for="dob">D.O.B</label>
                <input type="text" id="dob" name="dob" placeholder="Enter Date of Birth" required>
            </div>
            
            <div class="form-group">
                <label for="father_name">Father Name</label>
                <input type="text" id="father_name" name="father_name" placeholder="Enter Father Name" required>
            </div>
            
            <div class="form-group">
                <label for="mother_name">Mother Name</label>
                <input type="text" id="mother_name" name="mother_name" placeholder="Enter Mother Name" required>
            </div>
            
            <div class="form-group">
                <label for="hobbies">Hobbies</label>
                <input type="text" id="hobbies" name="hobbies" placeholder="Enter Hobbies" required>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</body>
</html>
